---
layout: default
---

<style>
    .hero-background {
        position: relative;
        width: 100vw;
        height: 100vh;
        margin-left: calc(50% - 50vw);
        overflow: hidden;
    }

    .hero-background__media {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
    }

    .hero-background__overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
    }

    .hero-background__content {
        position: relative;
        z-index: 1;

        display: flex;
        align-items: center;
        justify-content: center;

        width: 100%;
        height: 100%;

        color: white;
        text-align: center;
    }

    .hero-background__content h1 {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 6rem);
    }

    .page-content {
        padding-top: 0;
    }
</style>

<section class="hero-background">
    {% if page.hero_video %}
    <video class="hero-background__media" autoplay muted loop playsinline aria-hidden="true">
        <source src="{{ page.hero_video | relative_url }}" type="video/mp4">
    </video>
    {% endif %}

    <div class="hero-background__overlay"></div>

    <div class="hero-background__content">
        <h1>{{ page.title }}</h1>
    </div>
</section>

<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">

    <header class="post-header">
        <p class="post-meta">
            {%- assign date_format = site.minima.date_format | default: "%b %-d, %Y" -%}
            <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
                {{ page.date | date: date_format }}
            </time>
        </p>
    </header>

    <div class="post-content e-content" itemprop="articleBody">
        {{ content }}
    </div>

</article>
